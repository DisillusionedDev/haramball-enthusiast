<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Squad Interface</title>
    <style>
        :root {
            --pitch-green: #1b4d3e;
            --pitch-line: rgba(255, 255, 255, 0.4);
            --dark-bg: #111827;
            --card-bg: #1f2937;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--dark-bg); color: var(--text-main); padding: 20px; }
        
        .dashboard-container { display: grid; grid-template-columns: 1fr 380px; gap: 20px; max-width: 1400px; margin: 0 auto; }
        
        .control-bar { grid-column: 1 / -1; background: var(--card-bg); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        select { background: #374151; color: white; border: 1px solid #4b5563; padding: 8px 16px; border-radius: 6px; font-size: 16px; width: 280px; }

        .pitch-canvas { background: var(--pitch-green); border: 4px solid white; border-radius: 12px; height: 680px; position: relative; overflow: hidden; box-shadow: inset 0 0 80px rgba(0,0,0,0.5); }
        .pitch-line-center { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--pitch-line); }
        .pitch-center-circle { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; border: 2px solid var(--pitch-line); border-radius: 50%; transform: translate(-50%, -50%); }
        .pitch-penalty-top { position: absolute; top: 0; left: 50%; width: 300px; height: 100px; border: 2px solid var(--pitch-line); transform: translateX(-50%); }
        
        .tactical-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-around; padding: 15px 0; }
        .formation-row { display: flex; justify-content: space-around; width: 100%; padding: 5px 0; }

        .player-node { background: rgba(17, 24, 39, 0.88); border: 2px solid #4b5563; border-radius: 8px; padding: 8px; width: 115px; text-align: center; cursor: pointer; transition: all 0.2s ease; z-index: 10; }
        .player-node:hover { border-color: var(--accent-blue); transform: scale(1.05); }
        .player-node.selected { border-color: #eab308; box-shadow: 0 0 14px #eab308; }
        .node-pos { font-size: 10px; font-weight: bold; color: #3b82f6; text-transform: uppercase; background: rgba(59, 130, 246, 0.15); display: inline-block; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
        .node-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0; }
        .node-val { font-size: 11px; color: #10b981; }

        .sidebar-panel { background: var(--card-bg); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .panel-heading { border-bottom: 1px solid #374151; padding-bottom: 10px; }
        .stat-matrix { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-item { background: #273549; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; }
        .stat-lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        
        .swap-list-container { flex-grow: 1; overflow-y: auto; max-height: 320px; border-top: 1px solid #374151; padding-top: 15px; }
        .swap-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #273549; margin-bottom: 6px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .swap-row:hover { background: #374151; }

        .delta-positive { color: #10b981; font-size: 12px; margin-left: 5px; font-weight: bold; }
        .delta-negative { color: #ef4444; font-size: 12px; margin-left: 5px; font-weight: bold; }

        @media (max-width: 900px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .pitch-canvas { height: 520px; }
        }
    </style>

    <!-- Load automated backend dataset -->
    <script src="players_data.js"></script>
</head>
<body>

<div class="dashboard-container">
    <div class="control-bar">
        <h2>Tactical Management System</h2>
        <div>
            <label style="margin-right: 10px; color: var(--text-muted);">Active Club:</label>
            <select id="clubSelector" onchange="loadClubSquad()"></select>
        </div>
        <h3 id="formationDisplay" style="color: var(--accent-blue);">Formation: --</h3>
    </div>

    <div class="pitch-canvas">
        <div class="pitch-line-center"></div>
        <div class="pitch-center-circle"></div>
        <div class="pitch-penalty-top"></div>
        <div id="tacticalGrid" class="tactical-grid"></div>
    </div>

    <div class="sidebar-panel">
        <div class="panel-heading">
            <h3 id="panelPlayerName">Loading Tactical Grid...</h3>
            <p id="panelPlayerMeta" style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Assembling spatial vectors</p>
        </div>
        
        <div id="statsMatrix" class="stat-matrix" style="display: none;">
            <div class="stat-item"><span class="stat-lbl">Rating</span><span id="statRating" class="stat-val">0.00</span></div>
            <div class="stat-item"><span class="stat-lbl">Price</span><span id="statPrice" class="stat-val">£0.0M</span></div>
            <div class="stat-item"><span class="stat-lbl">Appearances</span><span id="statApps" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-lbl">Goals</span><span id="statGoals" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-lbl">Assists</span><span id="statAssists" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-lbl">Shots (On Target)</span><span id="statShots" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-lbl">Interceptions</span><span id="statInterceptions" class="stat-val">0</span></div>
            <div class="stat-item"><span class="stat-lbl">Tackles Won</span><span id="statTackles" class="stat-val">0</span></div>
        </div>

        <div id="swapInterface" class="swap-list-container" style="display: none;">
            <h4 style="margin-bottom: 10px; font-size: 14px;">Eligible Tactical Substitutes</h4>
            <div id="swapList"></div>
        </div>
    </div>
</div>

<script>
    let globalData = { clubs: {}, player_pool: {} };
    let selectedNodeIndex = null;
    let activeClubLineup = [];

    function initializeSystem() {
        if (window.TACTICAL_DATA && window.TACTICAL_DATA.clubs) {
            globalData = window.TACTICAL_DATA;
            populateClubSelector();
        } else {
            document.getElementById('panelPlayerName').textContent = "Data feed disconnected";
            document.getElementById('panelPlayerMeta').textContent = "Verify your workflow pipeline has generated players_data.js.";
        }
    }

    function populateClubSelector() {
        const selector = document.getElementById('clubSelector');
        selector.innerHTML = '';
        Object.keys(globalData.clubs).sort().forEach(club => {
            const opt = document.createElement('option');
            opt.value = club; opt.textContent = club;
            selector.appendChild(opt);
        });
        resetSidebar();
        loadClubSquad();
    }

    function loadClubSquad() {
        const club = document.getElementById('clubSelector').value;
        if (!club) return;
        
        document.getElementById('formationDisplay').textContent = `Formation: ${globalData.clubs[club].formation}`;
        activeClubLineup = JSON.parse(JSON.stringify(globalData.clubs[club].lineup));
        selectedNodeIndex = null;
        resetSidebar();
        renderTacticalPitch();
    }

    function renderTacticalPitch() {
        const grid = document.getElementById('tacticalGrid');
        grid.innerHTML = '';
        
        // Multi-tier spatial grid blueprint
        const pitchLines = {
            'FW_LINE': [],  // Wingers & Strikers
            'AM_LINE': [],  // Attacking Midfielders
            'CM_LINE': [],  // Central Mids & Box-to-Box
            'DM_LINE': [],  // Defensive Anchors
            'DF_LINE': [],  // Fullbacks & Center Backs
            'GK_LINE': []   // Goalies
        };
        
        // Map players to granular vertical tactical layers
        activeClubLineup.forEach((slot, index) => {
            const profile = globalData.player_pool[slot.current_player];
            const role = profile ? profile.role_code : slot.position;
            
            let destination = 'CM_LINE';
            if (role === 'GK') destination = 'GK_LINE';
            elif (role === 'CB' || role === 'FB' || slot.position === 'DF') destination = 'DF_LINE';
            elif (role === 'DM') destination = 'DM_LINE';
            elif (role === 'CM' || role === 'B2B') destination = 'CM_LINE';
            elif (role === 'AM') destination = 'AM_LINE';
            elif (role === 'ST' || role === 'WGR' || slot.position === 'FW') destination = 'FW_LINE';
            
            pitchLines[destination].push({ slot, index, profile });
        });

        // Horizontal flank-sorting logic for Defenders
        if (pitchLines['DF_LINE'].length > 0) {
            const fbs = pitchLines['DF_LINE'].filter(p => p.profile?.role_code === 'FB');
            const cbs = pitchLines['DF_LINE'].filter(p => p.profile?.role_code !== 'FB');
            const sortedDF = [];
            const leftWingCount = Math.ceil(fbs.length / 2);
            
            sortedDF.push(...fbs.slice(0, leftWingCount)); // Left-back channel
            sortedDF.push(...cbs);                         // Center-back spine
            sortedDF.push(...fbs.slice(leftWingCount));    // Right-back channel
            pitchLines['DF_LINE'] = sortedDF;
        }

        // Horizontal flank-sorting logic for Attackers
        if (pitchLines['FW_LINE'].length > 0) {
            const wgrs = pitchLines['FW_LINE'].filter(p => p.profile?.role_code === 'WGR');
            const sts = pitchLines['FW_LINE'].filter(p => p.profile?.role_code !== 'WGR');
            const sortedFW = [];
            const leftWingerCount = Math.ceil(wgrs.length / 2);
            
            sortedFW.push(...wgrs.slice(0, leftWingerCount)); // Left wingers
            sortedFW.push(...sts);                             // Central strikers
            sortedFW.push(...wgrs.slice(leftWingerCount));    // Right wingers
            pitchLines['FW_LINE'] = sortedFW;
        }

        // Render tiers sequentially down the field mapping array
        const renderingSequence = ['FW_LINE', 'AM_LINE', 'CM_LINE', 'DM_LINE', 'DF_LINE', 'GK_LINE'];
        
        renderingSequence.forEach(lineKey => {
            const items = pitchLines[lineKey];
            if (items.length === 0) return; // Skip tier if unpopulated, CSS handles spacing beautifully

            const rowDiv = document.createElement('div');
            rowDiv.className = 'formation-row';
            
            items.forEach(item => {
                const node = document.createElement('div');
                node.className = `player-node ${selectedNodeIndex === item.index ? 'selected' : ''}`;
                node.onclick = () => selectPitchNode(item.index);
                
                const dispRole = item.profile ? (item.profile.role_code || item.slot.position) : item.slot.position;
                const dispName = item.profile ? item.profile.name : "Vacant Slot";
                const dispPrice = item.profile ? `£${item.profile.price}M` : "--";
                
                node.innerHTML = `
                    <div class="node-pos">${dispRole}</div>
                    <div class="node-name">${dispName}</div>
                    <div class="node-val">${dispPrice}</div>
                `;
                rowDiv.appendChild(node);
            });
            grid.appendChild(rowDiv);
        });
    }

    function selectPitchNode(index) {
        selectedNodeIndex = index;
        renderTacticalPitch();
        const slot = activeClubLineup[index];
        const activePlayer = globalData.player_pool[slot.current_player];
        if (!activePlayer) return;

        document.getElementById('panelPlayerName').textContent = activePlayer.name;
        document.getElementById('panelPlayerMeta').textContent = `${activePlayer.club} | ${activePlayer.role_name || activePlayer.position}`;
        
        document.getElementById('statRating').textContent = activePlayer.stats.rating;
        document.getElementById('statPrice').textContent = `£${activePlayer.price}M`;
        document.getElementById('statApps').textContent = activePlayer.stats.appearances;
        document.getElementById('statGoals').textContent = activePlayer.stats.goals;
        document.getElementById('statAssists').textContent = activePlayer.stats.assists;
        document.getElementById('statShots').textContent = `${activePlayer.stats.shots} (${activePlayer.stats.shots_on_target})`;
        document.getElementById('statInterceptions').textContent = activePlayer.stats.interceptions;
        document.getElementById('statTackles').textContent = activePlayer.stats.tackles_won;
        
        document.getElementById('statsMatrix').style.display = 'grid';
        renderSubstitutesList(slot.position, activePlayer);
    }

    function renderSubstitutesList(position, originalPlayer) {
        const container = document.getElementById('swapInterface');
        const list = document.getElementById('swapList');
        list.innerHTML = '';
        
        const substitutes = Object.keys(globalData.player_pool)
            .map(key => globalData.player_pool[key])
            .filter(p => p.position === position && p.name !== originalPlayer.name);

        if (substitutes.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted); font-size:12px;">No squad depth at position.</p>';
        } else {
            substitutes.sort((a,b) => b.stats.minutes - a.stats.minutes).slice(0, 15).forEach(sub => {
                const row = document.createElement('div');
                row.className = 'swap-row';
                row.onclick = () => executeSwapSequence(sub);
                
                const goalDelta = sub.stats.goals - originalPlayer.stats.goals;
                const displayRoleTag = sub.role_code || sub.position;
                
                row.innerHTML = `
                    <div>
                        <strong>${sub.name}</strong> <span style="font-size:10px; color:var(--accent-blue);">[${displayRoleTag}]</span><br>
                        <span style="font-size:11px; color:var(--text-muted);">${sub.club}</span>
                    </div>
                    <div style="text-align:right;">
                        <span>£${sub.price}M</span><br>
                        <span class="${goalDelta >= 0 ? 'delta-positive' : 'delta-negative'}">Gls: ${sub.stats.goals}</span>
                    </div>
                `;
                list.appendChild(row);
            });
        }
        container.style.display = 'block';
    }

    function executeSwapSequence(targetPlayerProfile) {
        if (selectedNodeIndex === null) return;
        const compoundKey = `${targetPlayerProfile.name} (${targetPlayerProfile.club})`;
        
        activeClubLineup[selectedNodeIndex].current_player = compoundKey;
        renderTacticalPitch();
        selectPitchNode(selectedNodeIndex);
    }

    function resetSidebar() {
        document.getElementById('panelPlayerName').textContent = "Select a Player";
        document.getElementById('panelPlayerMeta').textContent = "Click an asset on the tactical board";
        document.getElementById('statsMatrix').style.display = 'none';
        document.getElementById('swapInterface').style.display = 'none';
    }

    window.onload = initializeSystem;
</script>
</body>
</html>
