name: Sync Live Player Data

on:
  schedule:
    - cron: '0 4 * * *' # Fires automatically every day at 4:00 AM UTC
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI

permissions:
  contents: write # CRITICAL: Grants the runner permission to push data back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Understat Sync Script
        run: python sync_api.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/players.json
          
          # Only commit and push if the file actually changed to prevent empty build loops
          if ! git diff --cached --quiet; then
            git commit -m "chore: dynamic live roster and 4-3-3 formation sync [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No data updates detected. Skipping push."
          fi
