name: Automated Football Tactical Sync

on:
  schedule:
    - cron: '0 4 * * *' # Runs automatically every day at 4:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write # Gives the runner permission to commit data back to your repo

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository so files are accessible to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Initialize Python with dependency caching enabled
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install required third-party libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the dynamic tactical extraction script
      - name: Run Tactical Data Sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python sync_api.py

      # Step 5: Commit and push the updated json backend back to the repository
      - name: Commit and Push Tactical Data Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/players.json
          
          # Only commit and push if the data actually changed to avoid empty commit loops
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update tactical player matrix and formations [skip ci]"
            git push
          else
            echo "No changes detected in tactical player matrix. Skipping push."
          fi
