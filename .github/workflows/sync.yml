name: Sync Player Data

on:
  workflow_dispatch: # 🟢 Gives you a manual "Refresh Data" button
  push:
    paths:
      - 'players_data-2025_2026.csv' # 🚀 Auto-runs if you upload a new CSV file

jobs:
  sync-job:
    runs-on: ubuntu-latest
    
    # Grant permission to write the updated JSON back to your repository
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Execute Sync Script
      run: python sync_csv.py

    - name: Commit and Push Generated Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        # Only commit if changes actually occurred
        git diff-index --quiet HEAD || (git commit -m "🔄 Automated data pipeline sync" && git push)
