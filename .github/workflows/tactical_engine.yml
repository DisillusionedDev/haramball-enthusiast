jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial: This grants permission to push back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Engine
        run: |
          pip install pandas
          python engine.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/players.json
          git commit -m "chore: update data via automated harvest" || echo "No changes to commit"
          git push
