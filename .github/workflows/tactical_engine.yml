name: Weekly Multi-League Tactical Harvest

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

jobs:
  harvest-and-compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # Cache removed to prevent file-not-found build errors

    - name: Install Extraction Dependencies
      run: |
        pip install requests beautifulsoup4 pandas lxml

    - name: Execute Analytical Engine Pipeline
      run: python engine.py

    - name: Securely Commit and Push Compiled Assets
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add docs/
        git commit -m "Automated aggregation of 11-position multi-league player metrics" || exit 0
        git push
